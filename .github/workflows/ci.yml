      ARCH: powerpc64-linux-gnu
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install qemu-user gcc-powerpc64-linux-gnu g++-powerpc64-linux-gnu binutils-powerpc64-linux-gnu libc6-ppc64-powerpc-cross libc6-dev-ppc64-powerpc-cross python3-pip
          sudo python3 -m pip install lief
