  powerpc64le:
    runs-on: ubuntu-latest
    env:
      ARCH: powerpc64le-linux-gnu
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install qemu-user gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu binutils-powerpc64le-linux-gnu libc6-ppc64el-cross libc6-dev-ppc64el-cross python3-pip
          sudo python3 -m pip install lief
