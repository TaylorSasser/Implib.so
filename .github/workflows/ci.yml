name: CI
on:
  push:
    branches:
      - master
      - add-osx-support
    paths-ignore:
      - 'LICENSE.txt'
      - '**.md'
      - 'specs/**'
  pull_request:
    paths-ignore:
      - 'LICENSE.txt'
      - '**.md'
      - 'specs/**'
jobs:
  Baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
        cc: [[gcc, g++], [clang, clang++]]
        py: ['3.7', '3.10']
        exclude:
          - os: ubuntu-22.04
            cc: [clang, clang++]
          - os: ubuntu-latest
            cc: [clang, clang++]
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc[0] }}
      CXX: ${{ matrix.cc[1] }}
      PYTHON: python3
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.py }}
      - name: Install deps
        run: |
          python3 -m pip install lief
      - name: Run tests
        run: scripts/travis.sh

  PyPy:
    runs-on: ubuntu-latest
    env:
      PYTHON: pypy3
    steps:
      - uses: actions/checkout@v3
      - name: Set up PyPy
        uses: actions/setup-python@v4
        with:
          python-version: 'pypy3.9'
      - name: Install deps
        run: |
          pypy3 -m pip install lief
      - name: Run tests
        run: scripts/travis.sh

  Pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get install pylint python3-pip
          sudo python3 -m pip install lief
      - name: Run tests
        run: |
          pylint implib-gen.py
          pylint scripts/ld

  Coverage:
    runs-on: ubuntu-latest
    environment: secrets
    env:
      COVERAGE: 1
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      PYTHON: 'coverage run -a'
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get install python3 python3-pip
          sudo python3 -m pip install codecov lief
      - name: Run tests
        run: scripts/travis.sh
      - name: Upload coverage
        run: |
          for t in tests/*; do
            if test -d $t -a -f $t/.coverage; then
              (cd $t && coverage xml)
            fi
          done
          codecov --required

  avx:
    runs-on: ubuntu-latest
    env:
      CFLAGS: -mavx
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get install python3-pip
          sudo python3 -m pip install lief
      - name: Run tests
        run: scripts/travis.sh
  musl:
    runs-on: ubuntu-latest
    env:
      CC: musl-gcc
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install musl-tools python3-pip
          sudo python3 -m pip install lief
      - name: Run tests
        run: scripts/travis.sh
  x86:
    runs-on: ubuntu-latest
    env:
      ARCH: i386-linux-gnueabi
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install gcc-multilib g++-multilib python3-pip
          sudo python3 -m pip install lief
      - name: Run tests
        run: scripts/travis.sh

  arm-arm:
    runs-on: ubuntu-latest
    env:
      ARCH: arm-linux-gnueabi
      CFLAGS: -marm
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install qemu-user gcc-arm-linux-gnueabi g++-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-armel-cross libc6-dev-armel-cross python3-pip
          sudo python3 -m pip install lief
      - name: Run tests
        run: scripts/travis.sh

  arm-thumb:
    runs-on: ubuntu-latest
    env:
      ARCH: arm-linux-gnueabi
      CFLAGS: -mthumb
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install qemu-user gcc-arm-linux-gnueabi g++-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-armel-cross libc6-dev-armel-cross python3-pip
          sudo python3 -m pip install lief
