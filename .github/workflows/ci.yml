  mipsel:
    runs-on: ubuntu-latest
    env:
      ARCH: mipsel-linux-gnu
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install qemu-user gcc-mipsel-linux-gnu g++-mipsel-linux-gnu binutils-mipsel-linux-gnu libc6-mipsel-cross libc6-dev-mipsel-cross python3-pip
