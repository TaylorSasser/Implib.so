        run: scripts/travis.sh

  riscv64:
    runs-on: ubuntu-latest
    env:
      ARCH: riscv64-linux-gnu
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install qemu-user gcc-riscv64-linux-gnu g++-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-riscv64-cross libc6-dev-riscv64-cross python3-pip
          sudo python3 -m pip install lief
      - name: Run tests
        run: scripts/travis.sh

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          run: |
            scripts/install-freebsd-prereqs.sh
            python3 -m ensurepip || true
            python3 -m pip install lief
            scripts/travis.sh
